name: MacNewFileKit

options:
  bundleIdPrefix: io.github.ywu73
  deploymentTarget:
    macOS: "13.0"

packages:
  MacNewFileKitCore:
    path: .

targets:
  MacNewFileKit:
    type: application
    platform: macOS
    sources:
      - MacNewFileKitApp
    dependencies:
      - target: MacNewFileKitFinder
        embed: true
      - package: MacNewFileKitCore
        product: FileCreationCore
      - package: MacNewFileKitCore
        product: MacNewFileKitShared
      - sdk: FinderSync.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ywu73.MacNewFileKit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Config/MacNewFileKit.entitlements
        SWIFT_VERSION: "6.0"
    info:
      path: Config/MacNewFileKit-Info.plist
      properties:
        CFBundleDisplayName: MacNewFileKit
        LSApplicationCategoryType: public.app-category.utilities
        MacNewFileKitAppGroupIdentifier: group.io.github.ywu73.MacNewFileKit

  MacNewFileKitFinder:
    type: app-extension
    platform: macOS
    sources:
      - MacNewFileKitFinder
    dependencies:
      - package: MacNewFileKitCore
        product: FileCreationCore
      - package: MacNewFileKitCore
        product: MacNewFileKitShared
      - sdk: AppKit.framework
      - sdk: FinderSync.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ywu73.MacNewFileKit.FinderSync
        CODE_SIGN_ENTITLEMENTS: Config/MacNewFileKitFinder.entitlements
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: YES
    info:
      path: Config/MacNewFileKitFinder-Info.plist
      properties:
        CFBundleDisplayName: MacNewFileKit Finder Extension
        MacNewFileKitAppGroupIdentifier: group.io.github.ywu73.MacNewFileKit
        NSExtension:
          NSExtensionAttributes: {}
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
